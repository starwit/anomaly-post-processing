[tool.poetry]
package-mode = false
name = "Anomaly Post Processing"
version = "4.0.5"
description = "This component consumes Anomalies from Valkey, save videos and sends reporting data to receivers like ai-cockpit."
authors = ["witchpou <anett.huebner@starwit.de>"]
license = "AGPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.12.5"
visionapi = { git = "https://github.com/starwit/vision-api.git", subdirectory = "python/visionapi", tag = "3.5.3" }
visionlib = { git = "https://github.com/starwit/vision-lib.git", subdirectory = "python", tag = "0.10.0" }
starwit-aic-api = { git = "https://github.com/starwit/starwit-aic-api.git", subdirectory = "python/generated-library", branch = "main" }
redis = "^5.3.1"
pydantic-settings = "^2.12.0"
prometheus-client = "^0.24.1"
tomlkit = "^0.14.0"
opencv-python = "^4.11.0.86"
minio = "^7.2.20"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
