name: Build and publish latest image

on:
  workflow_dispatch:

permissions: read-all

env:
  IMAGE_NAME: anomaly-post-processing
  DOCKER_ORG: docker.internal.starwit-infra.de  

jobs:
  build:
    name: "Build and run docker image"
    runs-on: [self-hosted, linux, X64]

    steps:
    - name: checkout
      uses: actions/checkout@v4
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_ORG }}
        username: ${{ secrets.DOCKER_INTERNAL_USERNAME }}
        password: ${{ secrets.DOCKER_INTERNAL_PASSWORD }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: build and push docker
      run: |
        echo "DOCKER_VERSION=$(cat pyproject.toml | grep "version" | cut -d'=' -f2 | xargs echo -n)"  >> $GITHUB_ENV

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        sbom: true
        provenance: mode=max
        push: true
        tags: ${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:${{ env.DOCKER_VERSION }}-${{ github.run_number }}

