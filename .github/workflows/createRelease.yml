name: Create release

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: "Build and run docker image"
    runs-on: [self-hosted, linux, X64]

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: checkout
      uses: actions/checkout@v4

    - name: Login internal docker registry
      uses: docker/login-action@v3
      with:
        registry: docker.internal.starwit-infra.de
        username: ${{ secrets.DOCKER_INTERNAL_USERNAME }}
        password: ${{ secrets.DOCKER_INTERNAL_PASSWORD }}

    - name: build docker
      env:
        GIT_CREDENTIALS: https://starwit:${{ secrets.VISION_PIPELINE_READ_TOKEN }}@github.com
      run: |
        docker build --secret id=GIT_CREDENTIALS -t docker.internal.starwit-infra.de/anomaly-post-processing:tmp .

  publish_docker:
    name: "Build and publish docker"
    needs: build
    runs-on: [self-hosted, linux, X64]

    steps:
    - name: Login internal docker registry
      uses: docker/login-action@v3
      with:
        registry: docker.internal.starwit-infra.de
        username: ${{ secrets.DOCKER_INTERNAL_USERNAME }}
        password: ${{ secrets.DOCKER_INTERNAL_PASSWORD }}

    - name: push docker versioned
      run: |
        DOCKER_VERSION=$(cat pyproject.toml | grep "version" | cut -d'=' -f2 | xargs echo -n)
        docker tag docker.internal.starwit-infra.de/anomaly-post-processing:tmp docker.internal.starwit-infra.de/anomaly-post-processing:$DOCKER_VERSION
        docker push docker.internal.starwit-infra.de/anomaly-post-processing:$DOCKER_VERSION

  publish_helm:
    name: "Publish helm chart"
    needs: build
    runs-on: [self-hosted, linux, X64]
    
    steps:
    - name: get helm
      uses: azure/setup-helm@v4

    - name: run helm package
      working-directory: deployment/helm
      run: |
        HELM_VERSION=$(cat ../../pyproject.toml | grep "version" | cut -d'=' -f2 | xargs echo -n)
        helm package . --version $HELM_VERSION

    - name: run helm push
      working-directory: application/target/helm
      run: |
        HELM_VERSION=$(cat ../../pyproject.toml | grep "version" | cut -d'=' -f2 | xargs echo -n)
        curl -i --fail-with-body -u ${{ secrets.HELM_INTERNAL_USERNAME }}:${{ secrets.HELM_INTERNAL_PASSWORD }} --data-binary "@anomaly-post-processing-$HELM_VERSION.tgz" https://helm.internal.starwit-infra.de/api/chart
