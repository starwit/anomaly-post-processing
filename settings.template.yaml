log_level: DEBUG
minio:                                      # MinIO settings for anomaly output (disabled if not defined)
  user: test
  password: test
  endpoint: localhost:9000
  secure: True
  bucket_name: test
redis_input:                                # Redis settings for anomaly input (mandatory)
  host: redis
  port: 6379
  stream_ids: 
    - stream1
  stream_prefix: anomalydetection
raw_anomaly: False                          # If True, raw anomaly data (frames, metadata) will be added to all outputs
redis_output:                               # Redis settings for anomaly output (disabled if not defined)
  host: redis
  port: 6379
  stream_id: stream1
  stream_prefix: reportingaicockpit
# local_output:                             # Local file output settings (disabled if not defined)
#   path: /tmp/anomalydetection
prometheus_port: 8000

