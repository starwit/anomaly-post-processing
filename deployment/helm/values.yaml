nameOverride: "anomaly-post-processing"
fullnameOverride: "anomaly-post-processing"
imageCredentials:
  registry: docker.internal.starwit-infra.de
image:
  repository: docker.internal.starwit-infra.de/anomaly-post-processing
config:
  minio:
    endpoint: "minio:9000"
    secure: True
    bucket_name: anomalies
  redis_input:
    host: redis
    port: 6379
    stream_ids: 
      - stream1
    stream_prefix: anomalydetection
  redis_output:
    enabled: True
    host: redis
    port: 6379
    stream_id: stream1
    stream_prefix: reportingaicockpit
  http_sender:
    enabled: False
    applicationUrl: http://localhost:8081
    endpoint: /api/aic/decision
  prometheus_port: 8001

# If this is not set, a default pull secret is created with the credentials from .imageCredentials 
# (and then used), otherwise it is assumed that the secrets exist
extraImagePullSecrets: []
# - name: pullSecretName