{{- $imageRepo := required "image repository for anomaly-post-processing is required" .Values.image.repository }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fullname" $ }}
  labels:
    {{- include "labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ include "fullname" $ }}
spec:
  selector:
    matchLabels:
      {{- include "selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ include "fullname" $ }}
  template:
    metadata:
      annotations:
        starwit.de/stage: anomaly-post-processing
        starwit.de/config-checksum: {{ include (print $.Template.BasePath "/anomaly-post-processing.configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ include "fullname" $ }}
    spec:
      serviceAccountName: {{ include "serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- $redisIn := $.Values.config.redis_input }}
        - name: wait-for-valkey-in
          image: valkey/valkey:7.2.6-alpine
          command: ["sh", "-c", "while ! redis-cli -h {{ $redisIn.host | default "localhost" }} -p {{ $redisIn.port | default 6379 }} ping ; do echo \"$(date -Iseconds) - still waiting for valkey\"; sleep 1; done"]
      containers:
        - name: {{ include "fullname" $ }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $imageRepo }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: prometheus
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /code/settings.yaml
              subPath: settings.yaml
            {{- if $.Values.config.local_output }}
            - name: anomaly-data
              mountPath: /anomaly-data
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: anomaly-post-processing-config
        {{- if $.Values.config.local_output }}
        - name: anomaly-data
          persistentVolumeClaim:
            claimName: {{ include "fullname" $ }}-anomaly-data
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
