{{- with .Values.anomalyPostProcessing }}
{{- $imageRepo := required "image repository for anomaly-post-processing is required" .image.repository }}
{{- $imageTag := required "image tag for anomaly-post-processing is required" .image.tag }}
{{- $config := . }}
{{- $streamId := .config.redis.stream_id -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anomalyPostProcessing.fullname" $ }}
  labels:
    {{- include "anomalyPostProcessing.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ include "anomalyPostProcessing.fullname" $ }}
spec:
  selector:
    matchLabels:
      {{- include "anomalyPostProcessing.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ include "anomalyPostProcessing.fullname" $ }}
  template:
    metadata:
      annotations:
        anomalyPostProcessing.starwit.de/stage: anomaly-post-processing
      labels:
        {{- include "anomalyPostProcessing.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ include "anomalyPostProcessing.fullname" $ }}
    spec:
      imagePullSecrets:
        - name: internal-docker-registry
      serviceAccountName: {{ include "anomalyPostProcessing.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "anomalyPostProcessing.fullname" $ }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $imageRepo }}:{{ $imageTag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: {{ $config.logLevel | quote }}
            - name: REDIS__HOST
              value: {{ include "anomalyPostProcessing.redisServiceName" $ }}
            - name: REDIS__PORT
              value: {{ include "anomalyPostProcessing.redisServicePort" $ }}
            - name: REDIS__STREAM_ID
              value: {{ $streamId | quote }}
            - name: MINIO__ENDPOINT
              value: {{ include "anomalyPostProcessing.minioEndpoint" $ }}
          ports:
            - name: prometheus
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /code/settings.yaml
              subPath: settings.yaml
      volumes:
        - name: config
          configMap:
            name: anomaly-post-processing-config
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}

