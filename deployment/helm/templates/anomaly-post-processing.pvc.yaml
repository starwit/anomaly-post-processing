apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "fullname" . }}-anomaly-data
  labels:
    {{- include "labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "fullname" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi